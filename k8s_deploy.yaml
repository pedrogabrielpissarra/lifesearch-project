apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifesearch
  labels:
    app: lifesearch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lifesearch
  template:
    metadata:
      labels:
        app: lifesearch
    spec:
      containers:
        - name: lifesearch
          image: image-registry.openshift-image-registry.svc:5000/sn-labs-pedropissarr/lifesearch:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lifesearch-secrets
                  key: flask-secret
            - name: LIFESEARCH_CACHE_DIR
              value: /tmp/lifesearch_cache
            - name: LIFESEARCH_RESULTS_DIR
              value: /tmp/lifesearch_results
            - name: LIFESEARCH_SESSION_DIR
              value: /tmp/flask_session
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: cache-volume
              mountPath: /home/ubuntu/lifesearch/cache
            - name: results-volume
              mountPath: /home/ubuntu/lifesearch_results
            - name: session-volume
              mountPath: /home/ubuntu/flask_session
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: lifesearch-pvc
        - name: results-volume
          persistentVolumeClaim:
            claimName: lifesearch-pvc
        - name: session-volume
          persistentVolumeClaim:
            claimName: lifesearch-pvc
